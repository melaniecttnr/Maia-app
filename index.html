<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Maïa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#1a0010;}
  body{display:flex;justify-content:center;align-items:flex-start;}
  #maia{
    font-family:'Inter',sans-serif;
    background:#fff8f1;
    width:100%;
    max-width:430px;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    color:#211b0b;
    box-shadow:0 0 60px rgba(0,0,0,0.4);
  }
  .page{animation:fadeUp .28s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .scroll{height:100vh;overflow-y:auto;padding-bottom:84px;scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
  .serif{font-family:'Noto Serif',serif;}
  .lxs{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#544248;font-weight:500;}

  /* NAV */
  .nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;
    z-index:50;display:flex;justify-content:space-around;align-items:center;
    padding:10px 8px 18px;
    background:rgba(238,225,200,.95);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-radius:24px 24px 0 0;
    box-shadow:0 -4px 24px rgba(33,27,11,.09);
  }
  .nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 16px;border-radius:12px;border:none;cursor:pointer;background:transparent;color:#867278;font-family:'Inter';font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;transition:all .2s;}
  .nb.on{background:#5B0533;color:#fff;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:100px;border:none;cursor:pointer;font-family:'Inter';font-size:14px;font-weight:500;transition:opacity .18s,transform .15s;line-height:1;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
  .bp{background:linear-gradient(140deg,#38001c,#5B0533);color:#fff;box-shadow:0 8px 24px rgba(56,0,28,.18);}
  .bp:not(:disabled):hover{opacity:.9;}
  .bs{background:#eee1c8;color:#5B0533;}
  .bs:hover{background:#e5d9bf;}
  .bfw{width:100%;}

  /* CARD */
  .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 18px rgba(33,27,11,.055);}

  /* PROGRESS */
  .pt{height:5px;background:#eee1c8;border-radius:99px;overflow:hidden;}
  .pf{height:100%;background:linear-gradient(90deg,#5B0533,#9b3d66);border-radius:99px;transition:width .5s ease;}

  /* INPUTS */
  .inp{width:100%;padding:0 0 13px;border:none;border-bottom:1.5px solid rgba(217,192,199,.25);background:transparent;font-family:'Noto Serif',serif;font-style:italic;font-size:22px;color:#211b0b;outline:none;transition:border-color .2s;}
  .inp::placeholder{color:rgba(33,27,11,.2);}
  .inp:focus{border-bottom-color:#5B0533;}
  .is{font-family:'Inter',sans-serif;font-style:normal;font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(217,192,199,.3)!important;background:#fff;outline:none;width:100%;}
  .is:focus{border-color:#5B0533!important;}
  textarea.is{resize:none;line-height:1.65;}
  input[type=range]{width:100%;accent-color:#5B0533;margin:4px 0;}

  /* SHEET */
  .bd{position:fixed;inset:0;background:rgba(33,27,11,.48);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .sh{background:#fff8f1;border-radius:24px 24px 0 0;padding:26px 22px 40px;width:100%;max-width:430px;max-height:82vh;overflow-y:auto;animation:su .3s ease;}
  @keyframes su{from{transform:translateY(100%)}to{transform:none}}

  /* PILLS */
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;}
  .ph{background:#f4e7cd;color:#544248;}
  .pd{background:#d4edda;color:#205027;}

  /* TAGS */
  .tag{background:#fec1d5;color:#7a4c5d;padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;display:inline-block;}

  /* SELECT ITEMS */
  .si{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:13px;border:2px solid transparent;background:#fff;cursor:pointer;text-align:left;font-family:'Inter';transition:all .18s;}
  .si.on{border-color:#5B0533;background:rgba(91,5,51,.07);}
  .si:hover:not(.on){background:#f4e7cd;}

  /* DOMAIN */
  .dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .di{display:flex;align-items:center;gap:8px;padding:12px 11px;border-radius:12px;border:2px solid transparent;background:#fff;cursor:pointer;font-family:'Inter';font-size:12px;color:#211b0b;transition:all .18s;}
  .di.on{border-color:#5B0533;background:rgba(91,5,51,.07);color:#5B0533;font-weight:600;}

  /* MOOD */
  .md{font-size:22px;padding:6px 7px;background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;transition:all .15s;}
  .md.on{border-color:#5B0533;background:rgba(91,5,51,.08);}

  /* VISION CARD */
  .vc{border-radius:16px;padding:18px 15px;display:flex;flex-direction:column;justify-content:space-between;min-height:120px;position:relative;overflow:hidden;}

  /* FILTER TABS */
  .ft{padding:7px 14px;border-radius:99px;border:none;cursor:pointer;font-family:'Inter';font-size:12px;white-space:nowrap;transition:all .18s;background:#f4e7cd;color:#544248;}
  .ft.on{background:#5B0533;color:#fff;font-weight:600;}

  /* DOTS LOADER */
  .dots{display:inline-flex;gap:3px;align-items:center;}
  .dots span{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dot 1.1s ease-in-out infinite;display:inline-block;}
  .dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
  @keyframes dot{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}

  .ico{display:inline-block;vertical-align:middle;flex-shrink:0;}
</style>
</head>

<div id="maia"></div>

const STORE_KEY='maia_v1';
function loadState(){try{const r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):null;}catch{return null;}}
function saveState(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s));}catch{}}

let S=loadState()||{user:null,visionCards:[],goals:[],journal:[],motivation:null,page:'home',step:0,ob:{prenom:'',age:'',domains:[],horizon:''},sheet:null,sd:{},filterH:'all',loading:{}};

function set(p){S={...S,...p};saveState(S);draw();}

// ─── AI ───────────────────────────────────────────────────────────────────────
// ⚠️  Remplacez YOUR_API_KEY_HERE par votre clé API Anthropic
// Obtenez-en une sur https://console.anthropic.com
const API_KEY='YOUR_API_KEY_HERE';

async function ai(sys,usr,max=600){
  if(API_KEY==='YOUR_API_KEY_HERE'){
    return '[Ajoutez votre clé API Anthropic dans le fichier maia.html pour activer l\'IA]';
  }
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,system:sys,messages:[{role:'user',content:usr}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content?.[0]?.text||'';
}

async function getMotiv(){
  if(S.loading.m)return;setL('m',true);
  try{
    const t=await ai(
      'Tu es Maïa. Génère une pensée du jour (2 phrases max), poétique, inspirante, en français. Aucun guillemet, aucun hashtag.',
      `Pour ${S.user.prenom}, domaines: ${S.user.domains.map(k=>DOMAINS.find(d=>d.k===k)?.l).join(', ')}. Horizon: ${HORIZONS.find(h=>h.k===S.user.horizon)?.l}.`
    );
    set({motivation:t.trim()});
  }catch{set({motivation:'Chaque journée porte en elle la promesse d\'un nouveau commencement.'});}
  finally{setL('m',false);}
}
async function aiDesc(title){
  if(!title.trim())return;setL('gd',true);
  try{const t=await ai('Maïa. 2 phrases max, inspirant, français. Pas de guillemets.',`Description pour: "${title}".`);S.sd={...S.sd,desc:t.trim()};}
  finally{setL('gd',false);draw();}
}
async function aiGoals(cid,ctxt){
  set({sheet:'sug',sd:{cid}});setL('gs',true);
  try{
    const t=await ai(
      `JSON uniquement, sans backticks ni markdown. Format: {"objectifs":[{"titre":"...","horizon":"court|moyen|long","domaine":"${DOMAINS.map(d=>d.k).join('|')}"}]}`,
      `3 objectifs concrets pour cette vision: "${ctxt}".`
    );
    S.sd={...S.sd,sug:JSON.parse(t.trim()).objectifs||[]};
  }catch{S.sd={...S.sd,sug:[{titre:'Objectif lié à ma vision',horizon:'moyen',domaine:'perso'}]};}
  finally{setL('gs',false);draw();}
}
async function aiRefl(content){
  if(!content.trim())return;setL('jr',true);
  try{const t=await ai('Maïa. 2-3 phrases de réflexion douce et bienveillante, en français, sans guillemets.',`Entrée de ${S.user?.prenom||'l\'utilisatrice'}: "${content}".`);S.sd={...S.sd,reflection:t.trim()};}
  finally{setL('jr',false);draw();}
}

'perso')===d.k?'rgba(91,5,51,.08)':'#f4e7cd'};color:${(sd.domain||'perso')===d.k?'#5B0533':'#544248'};font-family:'Inter';font-size:11px;cursor:pointer;font-weight:${(sd.domain||'perso')===d.k?600:400};">${DI[d.k]||''}${d.l}</button>`).join('')}</div><label class="lxs" id="pLabel" style="display:block;margin-bottom:4px;">Progression — ${sd.progress||0}%</label><input type="range" id="gP" min="0" max="100" step="5" value="${sd.progress||0}" style="margin-bottom:14px;" /><div style="display:flex;gap:8px;"><button class="btn bs" data-a="cls">Annuler</button><button class="btn bp" data-a="saveGoal" ${!(sd.title||'').trim()?'disabled':''} style="flex:1;">${I.check} Enregistrer</button></div></div></div>`;}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',handle,{once:true}));
  const o1=document.getElementById('ob1');
  if(o1){o1.focus();o1.addEventListener('input',e=>{S.ob={...S.ob,prenom:e.target.value};const b=document.querySelector('[data-a="ob1"]');if(b)b.disabled=!e.target.value.trim();});}
  const o2=document.getElementById('ob2');
  if(o2){o2.focus();o2.addEventListener('input',e=>{S.ob={...S.ob,age:e.target.value};const b=document.querySelector('[data-a="ob2"]');if(b)b.disabled=!e.target.value;});}
  const ct=document.getElementById('cTxt');if(ct)ct.addEventListener('input',e=>{S.sd={...S.sd,text:e.target.value};const b=document.querySelector('[data-a="saveCard"]');if(b)b.disabled=!e.target.value.trim();});
  const gt=document.getElementById('gT');if(gt)gt.addEventListener('input',e=>{S.sd={...S.sd,title:e.target.value};const b=document.querySelector('[data-a="saveGoal"]');if(b)b.disabled=!e.target.value.trim();});
  const gd=document.getElementById('gD');if(gd)gd.addEventListener('input',e=>{S.sd={...S.sd,desc:e.target.value};});
  const gp=document.getElementById('gP');if(gp)gp.addEventListener('input',e=>{S.sd={...S.sd,progress:parseInt(e.target.value)};const l=document.getElementById('pLabel');if(l)l.textContent=`Progression — ${e.target.value}%`;});
  const jc=document.getElementById('jC');if(jc)jc.addEventListener('input',e=>{S.sd={...S.sd,content:e.target.value};const b=document.querySelector('[data-a="saveJ"]');if(b)b.disabled=!e.target.value.trim();});
  const ti=document.getElementById('tI');if(ti){ti.addEventListener('input',e=>{S.sd={...S.sd,tagInput:e.target.value};});ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doTag();}});}
}

function doTag(){
  const ti=document.getElementById('tI');
  const v=(ti?.value||S.sd.tagInput||'').trim();
  if(v&&!(S.sd.tags||[]).includes(v)){S.sd={...S.sd,tags:[...(S.sd.tags||[]),v],tagInput:''};draw();}
}

function handle(e){
  const el=e.currentTarget;const a=el.dataset.a;
  if(a==='ob0')set({step:1});
  else if(a==='ob1'){if(S.ob.prenom.trim())set({step:2});}
  else if(a==='ob2'){if(S.ob.age)set({step:3});}
  else if(a==='ob3'){if(S.ob.domains.length>=1)set({step:4});}
  else if(a==='ob4'){if(S.ob.horizon){set({user:{prenom:S.ob.prenom,age:parseInt(S.ob.age),domains:S.ob.domains,horizon:S.ob.horizon}});setTimeout(getMotiv,300);}}
  else if(a==='dom'){const k=el.dataset.k;set({ob:{...S.ob,domains:S.ob.domains.includes(k)?S.ob.domains.filter(x=>x!==k):[...S.ob.domains,k]}});}
  else if(a==='hor')set({ob:{...S.ob,horizon:el.dataset.k}});
  else if(a==='nav')set({page:el.dataset.p,sheet:null});
  else if(a==='motiv')getMotiv();
  else if(a==='addCard')set({sheet:'addCard',sd:{theme:'rose',text:''}});
  else if(a==='cls')set({sheet:null,sd:{}});
  else if(a==='thm'){S.sd={...S.sd,theme:el.dataset.k};draw();}
  else if(a==='saveCard'){const t=document.getElementById('cTxt')?.value||S.sd.text||'';if(t.trim())set({visionCards:[...S.visionCards,{id:Date.now(),text:t.trim(),theme:S.sd.theme||'rose'}],sheet:null,sd:{}});}
  else if(a==='rmCard')set({visionCards:S.visionCards.filter(c=>c.id!==parseInt(el.dataset.id))});
  else if(a==='sug')aiGoals(parseInt(el.dataset.id),decodeURIComponent(el.dataset.txt));
  else if(a==='addSug'){const sg=S.sd.sug?.[parseInt(el.dataset.i)];if(sg)set({goals:[...S.goals,{id:Date.now(),title:sg.titre,horizon:sg.horizon,domain:sg.domaine,progress:0,desc:'Lié au tableau de vision',linked:S.sd.cid}],sheet:null,sd:{}});}
  else if(a==='fh')set({filterH:el.dataset.k});
  else if(a==='addGoal')set({sheet:'addGoal',sd:{title:'',horizon:'moyen',domain:'perso',desc:'',progress:0}});
  else if(a==='editGoal'){const g=S.goals.find(x=>x.id===parseInt(el.dataset.id));if(g)set({sheet:'editGoal',sd:{...g}});}
  else if(a==='gH'){S.sd={...S.sd,horizon:el.dataset.k};draw();}
  else if(a==='gDom'){S.sd={...S.sd,domain:el.dataset.k};draw();}
  else if(a==='aiD'){const t=document.getElementById('gT')?.value||S.sd.title||'';S.sd={...S.sd,title:t};aiDesc(t);}
  else if(a==='saveGoal'){const title=document.getElementById('gT')?.value||S.sd.title||'';const desc=document.getElementById('gD')?.value||S.sd.desc||'';const prog=parseInt(document.getElementById('gP')?.value??S.sd.progress??0);if(!title.trim())return;const sd=S.sd;if(S.sheet==='editGoal')set({goals:S.goals.map(g=>g.id===sd.id?{...g,title:title.trim(),desc,horizon:sd.horizon||'moyen',domain:sd.domain||'perso',progress:prog}:g),sheet:null,sd:{}});else set({goals:[...S.goals,{id:Date.now(),title:title.trim(),desc,horizon:sd.horizon||'moyen',domain:sd.domain||'perso',progress:prog}],sheet:null,sd:{}});}
  else if(a==='rmGoal')set({goals:S.goals.filter(g=>g.id!==parseInt(el.dataset.id))});
  else if(a==='addJ')set({sheet:'addJ',sd:{mood:'✨',content:'',tags:[],tagInput:'',reflection:''}});
  else if(a==='mood'){S.sd={...S.sd,mood:el.dataset.m};draw();}
  else if(a==='aiR'){const c=document.getElementById('jC')?.value||S.sd.content||'';S.sd={...S.sd,content:c};aiRefl(c);}
  else if(a==='addTag')doTag();
  else if(a==='rmTag'){S.sd={...S.sd,tags:(S.sd.tags||[]).filter(t=>t!==el.dataset.t)};draw();}
  else if(a==='saveJ'){const c=document.getElementById('jC')?.value||S.sd.content||'';if(!c.trim())return;const sd=S.sd;set({journal:[{id:Date.now(),date:new Date().toISOString(),content:c.trim(),mood:sd.mood||'✨',tags:sd.tags||[],reflection:sd.reflection||''},...S.journal],sheet:null,sd:{}});}
  else if(a==='rmJ')set({journal:S.journal.filter(j=>j.id!==parseInt(el.dataset.id))});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
draw();
</script>
</body>
</html>
